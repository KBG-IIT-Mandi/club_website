        - article [ref=e28]:
          - heading "Why KBG" [level=2] [ref=e29]
          - paragraph [ref=e30]: Biotechnology, data science, and engineering are converging faster than ever before. KBG empowers students to work at this intersection — where circuits meet cells, and algorithms meet ecosystems. Through events and projects, we aim to have fun while exploring new topics.
        - article [ref=e31]:
          - heading "What we do" [level=2] [ref=e32]
          - paragraph [ref=e33]: We do projects that combine biology with several engineering disciplines. We host workshops, talks, and hackathons to explore emerging topics at this intersection.
          - list [ref=e34]:
            - listitem [ref=e35]: Synthetic biology
            - listitem [ref=e36]: AI x Biology
            - listitem [ref=e37]: and many more
        - article [ref=e38]:
          - heading "What we have done" [level=2] [ref=e39]
          - paragraph [ref=e40]: Since our inception in 2020, KBG has successfully organized multiple workshops, talks, and hackathons. Our members have even represented IIT Mandi at iGEM. Following that legacy, we continue to spread knowledge about this field through our events and projects.
