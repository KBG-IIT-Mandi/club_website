  - main [ref=f2e19]:
    - main [ref=f2e21]:
      - generic [ref=f2e23]:
        - generic [ref=f2e24]:
          - paragraph [ref=f2e25]: KBG - Kamand Bioengineering Group
          - heading "An interdisciplinary student club at IIT Mandi exploring the frontiers of biology, engineering, and technology." [level=1] [ref=f2e26]
        - paragraph [ref=f2e27]: From synthetic biodesigns to AI-driven bio-models, we blend biology with computation, hardware, and creative engineering. Join us to build projects, attend workshops, and apply various engineering concepts with a biological twist.
        - paragraph [ref=f2e28]:
          - link "Contact Us" [ref=f2e29] [cursor=pointer]:
            - /url: mailto:kbg@students.iitmandi.ac.in
      - generic [ref=f2e32]:
        - article [ref=f2e33]:
          - heading "Our Projects" [level=3] [ref=f2e34]
          - paragraph [ref=f2e35]: From biosensing systems and cellular automata to bio-AI models, all developed by interdisciplinary teams.
        - article [ref=f2e36]:
          - heading "Events hosted" [level=3] [ref=f2e37]
          - paragraph [ref=f2e38]: Hands-on workshops, technical talks, design challenges, and hackathons bridging biology with computing and engineering.
        - article [ref=f2e39]:
          - heading "Lab Access" [level=3] [ref=f2e40]
          - paragraph [ref=f2e41]: Access to IIT Mandi research labs for real experimentation
      - generic [ref=f2e43]:
        - article [ref=f2e44]:
          - heading "Why KBG" [level=2] [ref=f2e46]
          - paragraph [ref=f2e47]: Biotechnology, data science, and engineering are converging faster than ever before. KBG empowers students to work at this intersection — where circuits meet cells, and algorithms meet ecosystems. Through events and projects, we aim to have fun while exploring new topics.
        - article [ref=f2e48]:
          - heading "What we do" [level=2] [ref=f2e50]
          - paragraph [ref=f2e51]: We do projects that combine biology with several engineering disciplines. We host workshops, talks, and hackathons to explore emerging topics at this intersection.
          - list [ref=f2e52]:
            - listitem [ref=f2e53]: Synthetic biology
            - listitem [ref=f2e54]: AI x Biology
            - listitem [ref=f2e55]: and many more
        - article [ref=f2e56]:
          - heading "What we have done" [level=2] [ref=f2e58]
          - paragraph [ref=f2e59]: Since our inception in 2020, KBG has successfully organized multiple workshops, talks, and hackathons. Our members have even represented IIT Mandi at iGEM. Following that legacy, we continue to spread knowledge about this field through our events and projects.
      - generic [ref=f2e61]:
        - heading "Focus Tracks" [level=2] [ref=f2e63]
        - generic [ref=f2e64]:
          - article [ref=f2e65]:
            - heading "AI × Biology" [level=3] [ref=f2e66]
            - paragraph [ref=f2e67]: Leverage data-driven models to interpret biological patterns and simulate life-inspired systems.
            - list [ref=f2e68]:
              - listitem [ref=f2e69]: Medical imaging and biosignal analysis
              - listitem [ref=f2e70]: AI in healthcare and genomics
              - listitem [ref=f2e71]: Neural Cellular Automata and generative bio-simulations
          - article [ref=f2e72]:
            - heading "Synthetic Biology & Biodesign" [level=3] [ref=f2e73]
            - paragraph [ref=f2e74]: Design and construct new biological parts, devices, and systems, or to redesign existing ones for useful purposes
            - list [ref=f2e75]:
              - listitem [ref=f2e76]: Drug development software
              - listitem [ref=f2e77]: Genetic circuit design and simulation
              - listitem [ref=f2e78]: Participation in iGEM and other biodesign competitions
          - article [ref=f2e79]:
            - heading "Bio Instrumentation" [level=3] [ref=f2e80]
            - paragraph [ref=f2e81]: Build hardware systems that interface with biological entities for monitoring, analysis, or intervention.
            - list [ref=f2e82]:
              - listitem [ref=f2e83]: Build our own EEG/ECG devices
              - listitem [ref=f2e84]: Analysis of biosignals using embedded systems
              - listitem [ref=f2e85]: Making exciting biosensors
      - generic [ref=f2e87]:
        - heading "Field Notes" [level=2] [ref=f2e89]
        - generic [ref=f2e90]:
          - figure [ref=f2e91]:
            - blockquote [ref=f2e92]: CRISPR gene editing now corrects sickle cell disease in living patients. We're literally rewriting genetic code to cure diseases once thought permanent.
          - figure [ref=f2e93]:
            - blockquote [ref=f2e94]: Lab-grown neurons learned to play Pong in 5 minutes. Biological cells outperformed AI at learning—brain-computer hybrids are here.
          - figure [ref=f2e95]:
            - blockquote [ref=f2e96]: Bacteria navigate using Earth's magnetic field with built-in compasses. Engineers are now embedding similar bio-magnetic sensors in medical nanorobots.
