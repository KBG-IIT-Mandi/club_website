      - generic [ref=f2e42]:
        - article [ref=f2e43]:
          - heading "Why KBG" [level=2] [ref=f2e44]
          - paragraph [ref=f2e45]: Biotechnology, data science, and engineering are converging faster than ever before. KBG empowers students to work at this intersection — where circuits meet cells, and algorithms meet ecosystems. Through events and projects, we aim to have fun while exploring new topics.
        - article [ref=f2e46]:
          - heading "What we do" [level=2] [ref=f2e47]
          - paragraph [ref=f2e48]: We do projects that combine biology with several engineering disciplines. We host workshops, talks, and hackathons to explore emerging topics at this intersection.
          - list [ref=f2e49]:
            - listitem [ref=f2e50]: Synthetic biology
            - listitem [ref=f2e51]: AI x Biology
            - listitem [ref=f2e52]: and many more
        - article [ref=f2e53]:
          - heading "What we have done" [level=2] [ref=f2e54]
          - paragraph [ref=f2e55]: Since our inception in 2020, KBG has successfully organized multiple workshops, talks, and hackathons. Our members have even represented IIT Mandi at iGEM. Following that legacy, we continue to spread knowledge about this field through our events and projects.
      - generic [ref=f2e57]:
        - heading "Grow with us" [level=2] [ref=f2e58]
        - paragraph [ref=f2e59]: The lab takes new researchers every semester. Bring biology, bring code, bring hardware — bring curiosity.
        - link "Join the collective" [ref=f2e60] [cursor=pointer]:
          - /url: mailto:kbg@students.iitmandi.ac.in
